<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/index.css">
  <title>Document</title>
</head>

<body>
  <div class="layout">
    <header class="layout__header">
      <a href="#"><img src="img/logo.png" alt="Logo KFC" class="header__logo"></a>
      <ul class="header__ul">
        <li class="header__li"><a href="#">Home</a></li>
        <li class="header__li"><a href="#">Menu</a></li>
        <li class="header__li"><a href="#">About</a></li>
        <li class="header__li"><a href="#">Contact</a></li>        
      </ul>
    </header>
    <main class="layout__main">
      <div class="main__text">
        <h2 class="main__title">Its Finger<br>Lickin <span>Good.</span></h2>
        <p class="main__description">Discover our delicious menu and enjoy the best fried chicken in town!</p>
        <a href="#" class="main__button">Order Now</a>
      </div>
      <div class="main__img">      
        <div class="img__container--img">
          <img src="img/combo.png" alt="" >        
        </div>
      </div>
    </main>
    <footer class="layout__footer">
      <p class="footer__text">© 2024 KFC. All rights reserved.</p>
      <ul class="footer__ul">
        <li class="footer__li"><a href="#"><ion-icon name="logo-facebook"></ion-icon></a></li>
        <li class="footer__li"><a href="#"><ion-icon name="logo-instagram"></ion-icon></a></li>
        <li class="footer__li"><a href="#"><ion-icon name="logo-tiktok"></ion-icon></a></li>
      </ul>

    </footer>
  </div>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
